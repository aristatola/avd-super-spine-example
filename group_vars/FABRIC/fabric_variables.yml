---
# Common AVD group variables
fabric_name: FABRIC

# Generate CSVs with fabric link info.
eos_designs_documentation:
  topology_csv: true
  p2p_links_csv: true

# Enable eAPI for programmatic access
management_eapi:
  enabled: true

# Default gateway for management network (172.16.1.0/24)
mgmt_gateway: 172.16.1.1

# VLAN-aware bundles reduce BGP EVPN route count by bundling VLANs
evpn_vlan_aware_bundles: true

cv_settings:
  cvaas:
    enabled: true
    clusters:
      - name: pod25
        region: staging
        vrf: MGMT
        token_file: /mnt/flash/cv-onboarding-token
        source_interface: Management1

# Define default node types based on hostnames
# Eliminates need to specify 'type' per node in inventory
default_node_types:
  - node_type: super-spine
    match_hostnames:
      - ".*-ss.*"
  - node_type: spine
    match_hostnames:
      - ".*-spine.*"
  - node_type: l3leaf
    match_hostnames:
      - ".*-leaf.*"

# Automatically assign interfaces based on node type
# Eliminates need to specify interfaces per node
default_interfaces:
  - types: [super-spine]
    platforms: [default]
    downlink_interfaces: [Ethernet1-4]   # Connects to pod spines
  - types: [spine]
    platforms: [default]
    uplink_interfaces: [Ethernet1-2]     # Connects to super-spines
    downlink_interfaces: [Ethernet3-4]   # Connects to leafs
  - types: [l3leaf]
    platforms: [default]
    uplink_interfaces: [Ethernet1-2]     # Connects to spines
    mlag_interfaces: [Ethernet3-4]       # MLAG peer-link

# Local users
aaa_settings:
  local_users:
    # Username with no password configured
    - name: admin
      privilege: 15
      role: network-admin
      no_password: true
    # Username with a password
    - name: arista
      privilege: 15
      role: network-admin
      sha512_password: "$6$Enl0WfE32FthwyiJ$yTyGaEJ2uPKLU.F7314YtB7J1jrzrMi7ogXIRTEHQfLdLgKWWmr1UvNlZLN6AyuxET7G5aH3AI9OYRzxVTkB1."

# BFD Settings
bfd_multihop:
  interval: 1200
  min_rx: 1200
  multiplier: 3

dns_settings:
  servers:
    - ip_address: 8.8.8.8
    - ip_address: 192.168.1.1

# NTP Servers IP or DNS name, first NTP server will be preferred, and sourced from Management VRF
ntp_settings:
  server_vrf: use_mgmt_interface_vrf
  servers:
    - name: 0.pool.ntp.org

# DHCP server pools for 10.26.XX.0/24 networks (XX = VLAN ID)
# DNS: Google (8.8.8.8/8.8.4.4) + Cloudflare (1.1.1.1)
# NTP: Google public NTP IPs via DHCP option 42 (vendor_id NTP, sub-option code 42)
custom_structured_configuration_dhcp_servers:
  - vrf: default
    lease_time_ipv4:
      days: 1
      hours: 0
      minutes: 0
    dns_servers_ipv4:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    ipv4_vendor_options:
      - vendor_id: NTP
        sub_options:
          - code: 42
            array_ipv4_address:
              - 216.239.35.0
              - 216.239.35.4
    ipv4_subnets:
      - subnet: 10.26.10.0/24
        name: VLAN10
        default_gateway: 10.26.10.1
        ranges:
          - start: 10.26.10.11
            end: 10.26.10.254
        reservations:
          - ipv4_address: 10.26.10.100
            mac_address: FE:ED:BE:EF:AA:AA
            hostname: testhost1
